<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國中英語雙模式挑戰平台</title>
    <!-- 載入 Tailwind CSS 框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 設定字體和整體背景 */
        body { font-family: 'Inter', sans-serif; background-color: #f7ffee; }
        .app-container { min-height: 80vh; }

        /* 單字卡片樣式 (靜態顯示) */
        .flashcard-static {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 10rem;
            background-color: #8b5cf6; /* 紫色 */
            color: white;
            border-radius: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            cursor: pointer; /* 加上 cursor pointer 增加互動感 */
        }

        /* 打字機效果 - 單字測驗 */
        .typewriter-text {
            border-right: .15em solid #f97316;
            animation: 
                typing 3s steps(30, end) forwards,
                blink-caret .75s step-end infinite;
            white-space: nowrap;
            overflow: hidden;
        }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: #f97316; } }

        /* 拖曳/點擊動畫 - 文法填空 */
        .drop-zone { min-height: 3.5rem; border: 3px dashed #a78bfa; transition: all 0.2s; }
        .drag-item { cursor: grab; transition: transform 0.2s, box-shadow 0.2s; }
        .drag-item.correct-animation { animation: bounce-in 0.8s ease-out; }
        .drag-item.incorrect-animation { animation: shake 0.5s; }
        
        /* 點擊模式下的選取狀態 */
        .drag-item.selected {
            border: 4px solid #f97316;
            box-shadow: 0 0 10px #f97316;
            transform: scale(1.05);
        }

        @keyframes bounce-in { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

<div id="app" class="max-w-4xl mx-auto bg-white p-6 rounded-3xl shadow-2xl app-container">
    
    <!-- 標題與模式切換區 -->
    <header class="text-center mb-8 border-b-2 pb-4">
        <h1 class="text-4xl font-extrabold text-purple-700 mb-2">🎓 國中英語挑戰平台 🚀</h1>
        <p class="text-lg text-gray-600">Unit 5: How Do We Go to the Hotel?</p>
        
        <!-- 模式切換按鈕 -->
        <div id="mode-switcher" class="mt-4 flex justify-center space-x-4">
            <button onclick="switchMode('menu')" id="btn-menu" class="px-4 py-2 bg-gray-200 text-gray-700 font-semibold rounded-full hover:bg-gray-300 transition">
                🏡 選單
            </button>
            <button onclick="switchMode('spelling')" id="btn-spelling" class="px-4 py-2 bg-purple-600 text-white font-semibold rounded-full hover:bg-purple-700 transition">
                🧠 單字測驗
            </button>
            <button onclick="switchMode('grammar')" id="btn-grammar" class="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-full hover:bg-indigo-700 transition">
                📝 文法填空
            </button>
        </div>
    </header>

    <!-- 1. 主選單模式 (Home Screen) -->
    <section id="mode-menu" class="mode-view">
        <div class="text-center p-10 bg-blue-50 rounded-2xl shadow-inner">
            <h2 class="text-3xl font-bold text-blue-800 mb-4">歡迎來到 Unit 5 挑戰！</h2>
            <p class="text-xl text-gray-700 mb-8">請選擇你想強化的學習模式：</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <button onclick="switchMode('spelling')" class="p-6 bg-purple-100 text-purple-800 rounded-xl shadow-lg hover:shadow-xl transition transform hover:scale-105">
                    <span class="text-4xl">✍️</span>
                    <p class="text-2xl font-bold mt-2">單字拼寫機</p>
                    <p class="text-sm mt-1">記憶訓練：看中文，拼寫英文單字</p>
                </button>
                <button onclick="switchMode('grammar')" class="p-6 bg-indigo-100 text-indigo-800 rounded-xl shadow-lg hover:shadow-xl transition transform hover:scale-105">
                    <span class="text-4xl">🚌</span>
                    <p class="text-2xl font-bold mt-2">文法片語填空</p>
                    <p class="text-sm mt-1">應用訓練：包含交通、導航、動作片語</p>
                </button>
            </div>
        </div>
    </section>

    <!-- 2. 單字測驗模式 (Spelling Quiz) -->
    <section id="mode-spelling" class="mode-view hidden p-4">
        <h2 class="text-3xl font-bold text-purple-600 mb-6 text-center">🧠 單字拼寫挑戰</h2>
        <p class="text-sm font-semibold mb-4 text-center">
            目前進度: <span id="progress-display">0/10</span>
        </p>
        
        <!-- 閃卡顯示區 (靜態卡片) -->
        <div id="flashcard-static" class="flashcard-static w-full mb-4">
            <div class="text-center">
                <p class="text-xl mb-2 font-light text-gray-200">請拼出此單字</p>
                <h2 class="text-5xl font-black mb-4" id="chinese-meaning"></h2> 
            </div>
        </div>

        <!-- 修正: 提示解釋區 (顯示在下方) -->
        <div id="spelling-hint-area" class="w-full p-4 bg-gray-100 rounded-xl mb-8 text-center border-2 border-gray-300 shadow-inner">
            <p class="text-lg font-bold mb-1 text-gray-700">點擊卡片顯示解釋與提示</p>
            <p class="text-xl italic text-gray-500 hidden" id="hint-text"></p>
            <p class="text-3xl font-bold mt-2 text-purple-600 hidden" id="spelling-result"></p>
        </div>
        
        <!-- 輸入區 -->
        <div class="flex flex-col space-y-4">
            <input type="text" id="spelling-input" class="w-full px-4 py-3 border-4 border-purple-400 rounded-xl text-2xl font-semibold focus:outline-none focus:border-purple-600 transition" placeholder="在此輸入英文單字..." disabled>
            <button id="check-button" onclick="checkSpelling()" class="w-full py-3 bg-green-500 text-white font-bold text-xl rounded-xl shadow-lg hover:bg-green-600 transition" disabled>
                檢查拼字
            </button>
            <button id="next-button" onclick="nextWord()" class="w-full py-3 bg-purple-600 text-white font-bold text-xl rounded-xl shadow-lg hover:bg-purple-700 transition hidden">
                下一題 (Next)
            </button>
        </div>

        <!-- 訊息提示區 -->
        <div id="message-box" class="mt-6 p-4 text-center rounded-xl transition duration-500 hidden">
            <p class="text-lg font-semibold" id="message-text"></p>
        </div>
    </section>

    <!-- 3. 文法填空模式 (Grammar Fill-in) -->
    <section id="mode-grammar" class="mode-view hidden p-4">
        <h2 class="text-3xl font-bold text-indigo-600 mb-6 text-center">📝 文法片語填空</h2>

        <div id="grammar-challenge" class="bg-indigo-50 p-6 rounded-2xl mb-8 border-l-4 border-indigo-400">
            <p class="text-xl font-semibold text-gray-700 mb-4" id="grammar-question">載入中...</p>
            <!-- 語法結構拖曳區 (Drop Zone) -->
            <div id="sentence-structure" class="text-3xl font-bold text-gray-800 flex flex-wrap items-center space-x-2 md:space-x-4">
                <!-- 句子結構會在這裡動態載入 -->
            </div>
        </div>
        
        <!-- 新增：點擊模式提示 -->
        <div class="mb-4 text-center text-sm text-gray-500">
            ✅ **行動裝置模式：** 請先點擊下方的選項，再點擊上方的空格進行填空。
        </div>

        <!-- 拖曳選項區 (Drag Items) -->
        <div id="grammar-options" class="bg-gray-100 p-6 rounded-2xl shadow-inner">
            <h3 class="text-xl font-bold text-gray-600 mb-4">選項：</h3>
            <div id="vehicle-options" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- 單字卡片會在這裡動態載入 -->
            </div>
        </div>

        <!-- 結果與訊息提示區 -->
        <div id="grammar-message-box" class="mt-8 p-4 text-center rounded-xl transition duration-500 hidden">
            <p class="text-2xl font-bold" id="grammar-message-text"></p>
            <button onclick="nextGrammarChallenge()" class="mt-4 px-6 py-2 bg-indigo-600 text-white rounded-full hover:bg-indigo-700 transition shadow-lg">
                下一題挑戰
            </button>
        </div>

        <!-- 提示區 (顯示完整正確句子) -->
        <div id="grammar-hint-area" class="mt-4 p-4 text-sm text-gray-600 bg-gray-100 rounded-lg hidden">
            <p id="full-sentence-display" class="font-medium"></p>
        </div>
    </section>

</div>

<script>
    // =================================================================
    // 1. 數據定義 (Data Definitions)
    // =================================================================

    // A. 單字測驗資料 (Vocabulary Data) - 升級為歸納式解釋
    const vocabulary = [
        { 
            word: "metro", 
            meaning: "捷運;地鐵", 
            hint: "名詞 (n.)。\n用法：指城市地鐵或捷運系統。\n例句：You can go there by bus or metro. (Unit 5, No. 1)" 
        },
        { 
            word: "lost", 
            meaning: "迷路的;走失的", 
            hint: "形容詞 (adj.)。\n多義：也表『不知所措的;迷惘的』。\n用法：常用於 get lost (迷路)。(Unit 5, No. 2)" 
        },
        { 
            word: "map", 
            meaning: "地圖", 
            hint: "名詞 (n.)。\n用法：問路或導航時使用。\n例句：We need a map now. (Unit 5, No. 3)" 
        },
        { 
            word: "ask", 
            meaning: "請求;詢問", 
            hint: "動詞 (v.)。\n用法：\n① ask + 人 + for + 物 (要求某物)\n② ask + 人 + to V (要求某人做...)\n(Unit 5, No. 4)" 
        },
        { 
            word: "excuse", 
            meaning: "藉口;理由 (n.) / 原諒 (v.)", 
            hint: "多義：名詞表『藉口』，動詞表『原諒』。\n片語：make excuses (找藉口)。(Unit 5, No. 5)" 
        },
        { 
            word: "straight", 
            meaning: "直地 (adv.) / 直的 (adj.)", 
            hint: "詞性：可作副詞或形容詞。\n用法：go straight (直走)。(Unit 5, No. 6)" 
        },
        { 
            word: "ship", 
            meaning: "輪船 (n.) / 運送 (v.)", 
            hint: "多義：名詞表『大船』，動詞表『運輸』。\n例句：They took a ship to the USA. (Unit 5, No. 21)" 
        },
        { 
            word: "taxi", 
            meaning: "計程車", 
            hint: "名詞 (n.)。\n用法：可搭配 take a taxi 或 by taxi。\n補充：taxi driver (計程車司機)。(Unit 5, No. 22)" 
        },
        { 
            word: "scooter", 
            meaning: "機車;滑板車", 
            hint: "名詞 (n.)。\n差異：與 motorcycle 的主要差異在於是否有腳踏板。(Unit 5, No. 25)" 
        },
        { 
            word: "hospital", 
            meaning: "醫院", 
            hint: "名詞 (n.)。\n用法：在醫院工作 (work at a hospital)；住院 (be in the hospital)。(Unit 5, No. 30)" 
        }
    ];
    
    // B. 文法填空資料 (Grammar Data) - 擴充片語和文法點
    const grammarData = [
      // 交通工具基礎用法
      {
        "id": 1,
        "question": "他們總是 [__] [__] 去那間博物館。",
        "structure": ["They always go to the museum", "【介系詞】", "【載具】", "."],
        "targetVerb": "by",
        "targetVehicle": "metro",
        "vehicleText": "Metro (捷運)",
        "icon": "🚇",
        "rule": "交通語法：搭乘方式用 'by' 時，後面直接接交通工具，不加冠詞 a/the。",
        "fullSentence": "They always go to the museum by metro."
      },
      {
        "id": 2,
        "question": "我們可以在這裡 [__] [__] 計程車回家嗎？",
        "structure": ["Can we", "【動詞】", "a", "【載具】", "home here?"],
        "targetVerb": "take",
        "targetVehicle": "taxi",
        "vehicleText": "Taxi (計程車)",
        "icon": "🚕",
        "rule": "交通語法：使用動詞 'take' 時，後面需要加上冠詞 a/the 再接交通工具。",
        "fullSentence": "Can we take a taxi home here?"
      },
      {
        "id": 3,
        "question": "我的朋友喜歡 [__] [__] 單車沿著河岸走。",
        "structure": ["My friend likes to", "【動詞】", "his", "【載具】", "along the bank."],
        "targetVerb": "ride",
        "targetVehicle": "bike",
        "vehicleText": "Bike (單車)",
        "icon": "🚲",
        "rule": "交通語法：騎乘兩輪或有座位的交通工具時，常使用 'ride'。",
        "fullSentence": "My friend likes to ride his bike along the bank."
      },
      // 上下車片語
      {
        "id": 4,
        "question": "我們需要在圖書館 [__] [__] 這輛公車。",
        "structure": ["We need to", "【動詞】", "【介系詞】", "the bus at the library."],
        "targetVerb": "get",
        "targetVehicle": "off",
        "vehicleText": "Off (下車)",
        "icon": "⬇️",
        "rule": "片語用法：'Get off' 用於下大型交通工具 (公車、火車、捷運)。",
        "fullSentence": "We need to get off the bus at the library."
      },
      // 導航片語
      {
        "id": 5,
        "question": "請在醫院右轉，然後 [__] [__] 直走。",
        "structure": ["Please turn right at the hospital and keep", "【動詞】", "【方向】", "."],
        "targetVerb": "going",
        "targetVehicle": "straight",
        "vehicleText": "Straight (直地)",
        "icon": "⬆️",
        "rule": "片語用法：'keep going straight' 意為保持直走。",
        "fullSentence": "Please turn right at the hospital and keep going straight."
      },
      {
        "id": 6,
        "question": "電影院在市場的 [__] [__]。",
        "structure": ["The theater is", "【介系詞片語】", "【地點】", "the market."],
        "targetVerb": "across",
        "targetVehicle": "from",
        "vehicleText": "From (對面)",
        "icon": "↔️",
        "rule": "介系詞片語：'across from' 意為在...的對面。",
        "fullSentence": "The theater is across from the market."
      },
      {
        "id": 7,
        "question": "你應該 [__] [__] 你的朋友來幫你。",
        "structure": ["You should", "【動詞】", "【片語】", "your friends to help you."],
        "targetVerb": "ask",
        "targetVehicle": "to",
        "vehicleText": "To (要求)",
        "icon": "👉",
        "rule": "動詞用法：'ask + 人 + to V' 意為要求某人做某事。",
        "fullSentence": "You should ask your friends to help you."
      },
      {
        "id": 8,
        "question": "艾咪 [__] [__] 店員要了一杯水。",
        "structure": ["Amy", "【動詞】", "【片語】", "the clerk for a glass of water."],
        "targetVerb": "asked",
        "targetVehicle": "for",
        "vehicleText": "For (要求)",
        "icon": "🎁",
        "rule": "動詞用法：'ask + 人 + for + 物' 意為向某人要求某物。",
        "fullSentence": "Amy asked the clerk for a glass of water."
      }
    ];
    
    // 拖曳選項 (干擾項)
    const extraOptions = [
        { key: "drive", text: "Drive (開車)", icon: "🚗", type: 'verb' },
        { key: "with", text: "With (和)", icon: "🤝", type: 'verb' },
        { key: "a", text: "A (一個)", icon: "1️⃣", type: 'article' },
        { key: "on", text: "On (在上)", icon: "👆", type: 'verb' }, 
        { key: "go", text: "Go (去)", icon: "🏃", type: 'verb' },
        { key: "scooter", text: "Scooter (機車)", icon: "🛵", type: 'vehicle' },
        { key: "train", text: "Train (火車)", icon: "🚆", type: 'vehicle' },
        { key: "past", text: "Past (經過)", icon: "➡️", type: 'preposition' },
        { key: "walk", text: "Walk (走路)", icon: "🚶", type: 'verb' }
    ];


    // =================================================================
    // 2. 全域狀態與元素參考 (Global State and Element References)
    // =================================================================

    // 模式切換狀態
    let currentMode = 'menu';
    const modes = ['menu', 'spelling', 'grammar'];
    
    // 單字測驗狀態
    let currentWordIndex = 0;
    let spellingScore = 0;
    let currentQuiz = null;

    // 文法填空狀態
    let currentGrammarIndex = 0;
    let dragData = {}; // 用於標準拖曳
    let selectedGrammarItem = null; // 用於點擊替換模式

    // 元素參考 (Spelling)
    const flashcardStaticEl = document.getElementById('flashcard-static'); 
    const spellingHintAreaEl = document.getElementById('spelling-hint-area'); 
    const hintTitleEl = spellingHintAreaEl ? spellingHintAreaEl.querySelector('p:first-child') : null; 

    const meaningEl = document.getElementById('chinese-meaning');
    const hintEl = document.getElementById('hint-text');
    const inputEl = document.getElementById('spelling-input');
    const checkBtn = document.getElementById('check-button');
    const nextBtn = document.getElementById('next-button');
    const messageBox = document.getElementById('message-box');
    const messageText = document.getElementById('message-text');
    const spellingResultEl = document.getElementById('spelling-result');
    const progressDisplay = document.getElementById('progress-display');


    // 元素參考 (Grammar)
    const grammarQuestionEl = document.getElementById('grammar-question');
    const structureEl = document.getElementById('sentence-structure');
    const grammarOptionsEl = document.getElementById('vehicle-options');
    const grammarMessageBox = document.getElementById('grammar-message-box');
    const grammarMessageText = document.getElementById('grammar-message-text');
    const fullSentenceDisplay = document.getElementById('full-sentence-display');
    const grammarHintArea = document.getElementById('grammar-hint-area');
    
    // =================================================================
    // 3. 模式切換邏輯 (Mode Switching Logic)
    // =================================================================

    document.addEventListener('DOMContentLoaded', () => {
        switchMode('menu');
        
        // 綁定靜態卡片的點擊事件 (用於顯示提示)
        if (flashcardStaticEl) {
            flashcardStaticEl.addEventListener('click', toggleSpellingHint);
        }
    });

    function switchMode(mode) {
        if (!modes.includes(mode)) return;

        currentMode = mode;

        // 隱藏所有內容區塊
        modes.forEach(m => {
            const el = document.getElementById(`mode-${m}`);
            if (el) el.classList.add('hidden');
            const btn = document.getElementById(`btn-${m}`);
            if (btn) btn.classList.remove('bg-purple-700', 'bg-indigo-700', 'text-white', 'bg-gray-300', 'text-gray-700');
        });
        
        // 顯示當前區塊並更新按鈕樣式
        const currentEl = document.getElementById(`mode-${mode}`);
        if (currentEl) currentEl.classList.remove('hidden');

        const currentBtn = document.getElementById(`btn-${mode}`);
        if (currentBtn) {
            if (mode === 'spelling') {
                currentBtn.classList.add('bg-purple-700', 'text-white');
            } else if (mode === 'grammar') {
                currentBtn.classList.add('bg-indigo-700', 'text-white');
            } else if (mode === 'menu') {
                 currentBtn.classList.add('bg-gray-300', 'text-gray-700');
            }
        }
        
        // 模式初始化
        if (mode === 'spelling') {
            // 洗牌並開始單字測驗
            vocabulary.sort(() => 0.5 - Math.random());
            currentWordIndex = 0;
            spellingScore = 0;
            startSpellingQuiz();
        } else if (mode === 'grammar') {
            // 重置文法狀態並開始挑戰
            grammarData.sort(() => 0.5 - Math.random());
            currentGrammarIndex = 0;
            selectedGrammarItem = null;
            startGrammarChallenge();
        }
    }


    // =================================================================
    // 4. 單字測驗邏輯 (Spelling Quiz Logic)
    // =================================================================

    function updateProgress() {
        progressDisplay.textContent = `${currentWordIndex}/${vocabulary.length}`;
    }

    function startSpellingQuiz() {
        if (currentWordIndex >= vocabulary.length) {
            endSpellingGame();
            return; // 遊戲結束，安全退出
        }
        
        currentQuiz = vocabulary[currentWordIndex];
        
        // 重置狀態
        inputEl.value = '';
        inputEl.focus();
        nextBtn.classList.add('hidden');
        checkBtn.classList.remove('hidden');
        messageBox.classList.add('hidden');
        inputEl.classList.remove('border-green-500', 'border-red-500');
        inputEl.disabled = false;
        checkBtn.disabled = false;
        
        // 設置卡片正面內容 (中文意思)
        meaningEl.textContent = currentQuiz.meaning;
        
        // 重置提示區
        hintTitleEl.textContent = "點擊卡片顯示解釋與提示"; // 提示區標題
        
        // 設置提示內容，並用換行符號取代 '\n'
        hintEl.innerHTML = currentQuiz.hint.replace(/\n/g, '<br>');
        
        hintEl.classList.add('hidden'); // 隱藏提示內容
        spellingResultEl.classList.add('hidden'); // 隱藏結果
        
        updateProgress();
    }

    // 點擊卡片顯示提示邏輯 (取代反轉)
    function toggleSpellingHint() {
        if (!currentQuiz) return; // 安全檢查

        // 答題後鎖定
        if (checkBtn.classList.contains('hidden')) return; 
        
        // 如果提示內容是隱藏的，就顯示它
        if (hintEl.classList.contains('hidden')) {
             hintTitleEl.textContent = "單字歸納與提示：";
             hintEl.classList.remove('hidden');
        } else {
             // 否則，隱藏它
             hintTitleEl.textContent = "點擊卡片顯示解釋與提示";
             hintEl.classList.add('hidden');
        }
    }


    // 檢查拼字
    function checkSpelling() {
        if (!currentQuiz) return; // 安全檢查

        const userInput = inputEl.value.toLowerCase().trim();
        const correctWord = currentQuiz.word.toLowerCase();

        inputEl.disabled = true;
        checkBtn.disabled = true;

        if (userInput === correctWord) {
            handleCorrectSpelling();
        } else {
            handleIncorrectSpelling(correctWord);
        }

        nextBtn.classList.remove('hidden');
    }

    function handleCorrectSpelling() {
        spellingScore++;
        messageBox.className = 'mt-6 p-4 text-center rounded-xl transition duration-500 bg-green-100 text-green-700 shadow-md';
        messageText.textContent = `✅ 拼字完全正確！太棒了！ (Score: ${spellingScore})`;
        inputEl.classList.add('border-green-500');
        
        // 修正: 顯示正確答案
        hintTitleEl.textContent = "✅ 正確拼法：";
        hintEl.classList.add('hidden'); // 隱藏提示
        spellingResultEl.classList.remove('hidden'); // 顯示結果
        spellingResultEl.textContent = currentQuiz.word;
    }

    function handleIncorrectSpelling(correctWord) {
        messageBox.className = 'mt-6 p-4 text-center rounded-xl transition duration-500 bg-red-100 text-red-700 shadow-md';
        messageText.textContent = `❌ 拼字錯誤！正確答案是...`;
        inputEl.classList.add('border-red-500');

        // 修正: 顯示打字機答案
        hintTitleEl.textContent = "❌ 正確拼法：";
        hintEl.classList.add('hidden'); // 隱藏提示
        spellingResultEl.classList.remove('hidden'); // 顯示結果

        spellingResultEl.textContent = '';
        typeWriterEffect(correctWord, spellingResultEl);
    }

    function typeWriterEffect(text, element) {
        let i = 0;
        element.classList.add('typewriter-text');
        
        const typingInterval = setInterval(() => {
            if (i < text.length) {
                element.textContent += text.charAt(i);
                i++;
            } else {
                clearInterval(typingInterval);
                element.classList.remove('typewriter-text');
            }
        }, 100); 
    }

    function nextWord() {
        currentWordIndex++;
        setTimeout(() => {
            startSpellingQuiz();
        }, 500); 
    }

    function endSpellingGame() {
        inputEl.disabled = true;
        checkBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');

        let finalMessage;
        if (spellingScore === vocabulary.length) {
            finalMessage = `🎉 恭喜！你以滿分 ${spellingScore}/${vocabulary.length} 完成所有單字拼寫！太厲害了！`;
        } else if (spellingScore >= vocabulary.length / 2) {
            finalMessage = `👍 挑戰完成！你的分數是 ${spellingScore}/${vocabulary.length}。表現不錯，再接再厲！`;
        } else {
            finalMessage = `💪 挑戰完成！你的分數是 ${spellingScore}/${vocabulary.length}。沒關係，多加練習就能掌握！`;
        }

        messageBox.className = 'mt-6 p-4 text-center rounded-xl transition duration-500 bg-blue-100 text-blue-700 shadow-xl';
        messageText.textContent = finalMessage;
    }


    // =================================================================
    // 5. 文法填空邏輯 (Grammar Fill-in Logic)
    // =================================================================

    function getVerbText(key) {
        switch (key) {
            case 'take': return 'Take (搭乘)'; case 'ride': return 'Ride (騎乘)'; case 'by': return 'By (藉由)';
            case 'on': return 'On (在...上)'; case 'get': return 'Get (得到)'; case 'off': return 'Off (離開)';
            case 'foot': return 'Foot (腳)'; case 'going': return 'Going (正在走)'; case 'straight': return 'Straight (直地)';
            case 'across': return 'Across (橫越)'; case 'from': return 'From (對面)'; case 'asked': return 'Asked (過去式)';
            case 'to': return 'To (不定詞)'; case 'for': return 'For (為了)'; default: return key.toUpperCase();
        }
    }
    function getVerbIcon(key) {
        switch (key) {
            case 'take': return '🖐️'; case 'ride': return '🚴'; case 'by': return '⏩';
            case 'on': return '⬆️'; case 'get': return '➡️'; case 'off': return '⬇️';
            case 'foot': return '🦶'; case 'going': return '🏃'; case 'straight': return '🛣️';
            case 'across': return '↔️'; case 'from': return '🔙'; case 'asked': return '📜';
            case 'to': return '🎯'; case 'for': return '🎁'; default: return '❓';
        }
    }
    function getVerbType(key) {
        if (['take', 'ride', 'get', 'going', 'asked'].includes(key)) return '動詞';
        if (['by', 'on', 'off', 'from', 'for'].includes(key)) return '介系詞';
        if (['across'].includes(key)) return '介系詞片語';
        if (['straight'].includes(key)) return '方向';
        if (['to'].includes(key)) return '不定詞';
        if (['foot', 'metro', 'taxi', 'bike', 'ship', 'scooter'].includes(key)) return '載具';
        return '其他';
    }

    // 新增：顯示除錯訊息
    function showGrammarDebug(text) {
        // 使用黃色背景的訊息框進行除錯回饋，並短暫顯示
        const debugEl = document.getElementById('grammar-message-text');
        const boxEl = document.getElementById('grammar-message-box');
        
        boxEl.classList.remove('hidden');
        boxEl.className = 'mt-8 p-4 text-center rounded-xl transition duration-500 bg-yellow-100 text-yellow-700 shadow-xl';
        debugEl.textContent = `[偵錯中] ${text}`;

        setTimeout(() => {
            // 只有在還未顯示正式結果時才隱藏
            if (boxEl.classList.contains('bg-yellow-100')) { 
                boxEl.classList.add('hidden');
            }
        }, 1500);
    }


    function startGrammarChallenge() {
        if (currentGrammarIndex >= grammarData.length) {
            showGrammarResult('🎉 恭喜你！你完成了所有的文法挑戰！', 'success');
            return;
        }

        const currentChallenge = grammarData[currentGrammarIndex];
        grammarQuestionEl.textContent = currentChallenge.question;
        grammarMessageBox.classList.add('hidden');
        structureEl.innerHTML = '';
        grammarOptionsEl.innerHTML = '';
        grammarHintArea.classList.add('hidden');
        
        // 清除選擇狀態
        selectedGrammarItem = null;

        // 隨機組合選項
        const requiredOptions = [
            { key: currentChallenge.targetVehicle, text: getVerbText(currentChallenge.targetVehicle), icon: getVerbIcon(currentChallenge.targetVehicle), type: getVerbType(currentChallenge.targetVehicle) },
            { key: currentChallenge.targetVerb, text: getVerbText(currentChallenge.targetVerb), icon: getVerbIcon(currentChallenge.targetVerb), type: getVerbType(currentChallenge.targetVerb) }
        ];

        const allOptions = [...requiredOptions, ...extraOptions]
            .filter((opt, i, self) => i === self.findIndex((t) => t.key === opt.key))
            .sort(() => 0.5 - Math.random());

        // 渲染語法結構
        currentChallenge.structure.forEach(part => {
            const span = document.createElement('span');
            span.className = 'py-2';
            if (part.includes('【')) {
                span.className = 'drop-zone bg-white rounded-xl shadow-inner flex items-center justify-center p-2 min-w-[6rem] min-h-[3.5rem] border-2 border-dashed border-indigo-400 hover:border-indigo-600 transition-all text-xl md:text-2xl';
                span.dataset.targetType = part.replace(/[【】]/g, ''); 
                
                // *** 綁定點擊事件用於手機模式 ***
                span.addEventListener('click', handleDropZoneClick);

                // 標準拖曳事件 (用於電腦滑鼠)
                span.addEventListener('dragover', allowDrop);
                span.addEventListener('dragleave', handleDragLeave);
                span.addEventListener('drop', handleDrop);
                
                span.textContent = part;
            } else {
                span.className = 'text-2xl md:text-3xl font-bold text-indigo-700 py-2';
                span.textContent = part;
            }
            structureEl.appendChild(span);
        });

        // 渲染拖曳選項
        allOptions.forEach(option => {
            const item = createDragItem(option);
            grammarOptionsEl.appendChild(item);
        });
    }

    function createDragItem(option) {
        const item = document.createElement('div');
        item.className = `drag-item card bg-indigo-200 text-indigo-800 p-3 rounded-lg text-center shadow-md text-sm md:text-base font-semibold`;
        item.draggable = true;
        item.textContent = `${option.icon} ${option.text}`;
        item.dataset.key = option.key;
        item.dataset.type = option.type;
        
        // 標準拖曳事件 (用於電腦滑鼠)
        item.addEventListener('dragstart', handleDragStart);
        
        // *** 綁定點擊事件用於手機模式 ***
        item.addEventListener('click', handleItemClick);

        return item;
    }

    // --- 點擊模式邏輯 ---
    function handleItemClick(e) {
        const clickedItem = e.currentTarget;
        
        // 移除所有選項的選取狀態
        document.querySelectorAll('.drag-item').forEach(item => {
            item.classList.remove('selected');
        });
        
        // 如果點擊的是已經選取的項目，則取消選取
        if (selectedGrammarItem && selectedGrammarItem.element === clickedItem) {
            selectedGrammarItem = null;
            showGrammarDebug(`選項『${clickedItem.dataset.key}』已取消選取。`);
        } else {
            // 否則，選取它
            clickedItem.classList.add('selected');
            selectedGrammarItem = {
                key: clickedItem.dataset.key,
                type: clickedItem.dataset.type,
                element: clickedItem
            };
            showGrammarDebug(`選項『${clickedItem.dataset.key}』已選取。請點擊空格。`);
        }
    }

    function handleDropZoneClick(e) {
        const dropZone = e.currentTarget;

        if (selectedGrammarItem) {
            // 1. 如果空格內已有項目，將其歸還到選項區
            const existingItem = dropZone.querySelector('.drag-item');
            if (existingItem) {
                existingItem.classList.remove('opacity-50', 'correct-animation', 'incorrect-animation', 'selected');
                grammarOptionsEl.appendChild(existingItem);
            }
            
            // 2. 移除選項區的選取狀態
            selectedGrammarItem.element.classList.remove('selected');
            
            // 3. 將選取的項目放入空格
            dropZone.innerHTML = '';
            dropZone.appendChild(selectedGrammarItem.element); 
            dropZone.classList.remove('border-dashed');
            dropZone.classList.add('border-solid', 'border-indigo-600', 'shadow-lg');
            
            // 4. 重置狀態並檢查
            showGrammarDebug(`已填入空格。正在檢查答案...`);
            selectedGrammarItem = null;
            checkGrammarCompletion();

        } else if (dropZone.querySelector('.drag-item')) {
            // 如果沒有選取任何項目，但點擊了有項目的空格，將項目歸還
            const itemToReturn = dropZone.querySelector('.drag-item');
            if (itemToReturn) {
                 itemToReturn.classList.remove('opacity-50', 'correct-animation', 'incorrect-animation', 'selected');
                 grammarOptionsEl.appendChild(itemToReturn);
                 
                 // 重置空格外觀
                 dropZone.innerHTML = `【${dropZone.dataset.targetType}】`;
                 dropZone.classList.add('border-dashed');
                 dropZone.classList.remove('border-solid', 'border-indigo-600', 'shadow-lg');
                 showGrammarDebug('已從空格中移除項目。');
            }
        } else {
            showGrammarDebug('請先點擊下方選項。');
        }
    }
    // --- 點擊模式邏輯結束 ---

    // --- 拖曳模式邏輯 (保留給電腦滑鼠操作) ---
    function handleDragStart(e) {
        // 清除點擊選取狀態 (避免衝突)
        document.querySelectorAll('.drag-item').forEach(item => item.classList.remove('selected'));
        selectedGrammarItem = null; 

        dragData = {
            key: e.target.dataset.key,
            type: e.target.dataset.type,
            element: e.target
        };
        setTimeout(() => e.target.classList.add('opacity-50'), 0); 
    }

    function allowDrop(e) {
        e.preventDefault();
        e.target.classList.add('bg-indigo-100'); 
    }

    function handleDragLeave(e) {
        e.target.classList.remove('bg-indigo-100');
    }

    function handleDrop(e) {
        e.preventDefault();
        const dropZone = e.currentTarget;
        dropZone.classList.remove('bg-indigo-100');

        const existingItem = dropZone.querySelector('.drag-item');
        if (existingItem) {
            existingItem.classList.remove('opacity-50', 'correct-animation', 'incorrect-animation');
            grammarOptionsEl.appendChild(existingItem);
        }

        dragData.element.classList.remove('opacity-50');
        dropZone.innerHTML = '';
        dropZone.appendChild(dragData.element); 
        
        // 確保 DOM 元素正確識別
        if (!dropZone.querySelector('.drag-item')) {
             dropZone.textContent = `【${dropZone.dataset.targetType}】`;
             return; 
        }

        dropZone.classList.remove('border-dashed');
        dropZone.classList.add('border-solid', 'border-indigo-600', 'shadow-lg');

        checkGrammarCompletion();
    }
    // --- 拖曳模式邏輯結束 ---


    function checkGrammarCompletion() {
        const dropZones = structureEl.querySelectorAll('.drop-zone');
        let filledCount = 0;
        let isCorrect = true;
        let droppedKeys = {}; 

        dropZones.forEach(zone => {
            const item = zone.querySelector('.drag-item');
            if (item) {
                filledCount++;
                const expectedType = zone.dataset.targetType;
                droppedKeys[expectedType] = item.dataset.key;
            }
        });

        if (filledCount === dropZones.length) {
            const currentChallenge = grammarData[currentGrammarIndex];
            
            // 由於欄位命名可能不同 (動詞/介系詞片語/方向)，我們使用目標鍵值進行精確檢查
            const targetKeys = {
                '動詞': currentChallenge.targetVerb,
                '介系詞': currentChallenge.targetVerb,
                '介系詞片語': currentChallenge.targetVerb,
                '不定詞': currentChallenge.targetVehicle,
                '載具': currentChallenge.targetVehicle,
                '方式': currentChallenge.targetVehicle,
                '方向': currentChallenge.targetVehicle,
                '地點': currentChallenge.targetVehicle,
                '片語': currentChallenge.targetVehicle
            };

            dropZones.forEach(zone => {
                const type = zone.dataset.targetType;
                const droppedKey = droppedKeys[type];
                const expectedKey = targetKeys[type];

                if (expectedKey && droppedKey !== expectedKey) {
                    isCorrect = false;
                }
            });


            // 顯示結果
            const resultType = isCorrect ? 'success' : 'error';
            const resultText = isCorrect ? `✅ 太棒了！正確答案是：${currentChallenge.fullSentence}` : `❌ 答錯了，請再想想！提示：${currentChallenge.rule}`;
            showGrammarResult(resultText, resultType);
            
            const items = structureEl.querySelectorAll('.drag-item');
            if (isCorrect) {
                items.forEach(item => item.classList.add('correct-animation'));
            } else {
                items.forEach(item => item.classList.add('incorrect-animation'));
                setTimeout(() => {
                    fullSentenceDisplay.textContent = `完整正確句子：${currentChallenge.fullSentence}`;
                    grammarHintArea.classList.remove('hidden');
                }, 1000);
            }
        }
    }

    function showGrammarResult(text, type) {
        // 這是顯示最終結果的函數
        grammarMessageText.textContent = text;
        grammarMessageBox.classList.remove('hidden');
        if (type === 'success') {
            grammarMessageBox.className = 'mt-8 p-4 text-center rounded-xl transition duration-500 bg-green-100 text-green-700 shadow-xl';
        } else {
            grammarMessageBox.className = 'mt-8 p-4 text-center rounded-xl transition duration-500 bg-red-100 text-red-700 shadow-xl';
        }
    }
    
    function nextGrammarChallenge() {
        currentGrammarIndex++;
        startGrammarChallenge();
    }
</script>
